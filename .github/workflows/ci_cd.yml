name: AI Chief of Staff — CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Unit & Performance Tests
        env:
          LYZR_AGENT_API_KEY: "mock-key-for-ci"
          LYZR_EXTRACTION_AGENT_ID: "mock-id-for-ci"
          LYZR_RAG_AGENT_ID: "mock-id-for-ci"
          JWT_SECRET: "mock-jwt-secret-for-ci"
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React Frontend
        run: |
          cd frontend
          npm run build

